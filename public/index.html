<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Dashboard - GPS Attendance</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="dashboard-container">

        <h1>GPS Attendance</h1>

        <h2>Student Dashboard</h2>

        <p>
            Welcome,
            <strong id="studentName">Student</strong>
        </p>

        <p>
            Student ID:
            <strong id="studentId">-</strong>
        </p>

        <p>
            Course:
            <strong id="studentCourse">-</strong>
        </p>

        <br>

        <button
            onclick="window.location.href='/attendance.html'"
        >
            Mark Attendance
        </button>

        <br>
        <br>

        <button
            onclick="window.location.href='/view-attendance.html'"
        >
            View My Attendance
        </button>

        <br>
        <br>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

    <script src="index.js"></script>

</body>

</html>
