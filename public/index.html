<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS Student Attendance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>📍 GPS Attendance</h1>

            <p class="subtitle">
                Student Attendance Management System
            </p>

            <!-- Student ID -->
            <div class="input-group">
                <label for="studentId">Student ID</label>

                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter Student ID"
                >
            </div>

            <!-- Mark Attendance -->
            <button id="attendanceBtn" onclick="markAttendance()">
                📍 Mark Attendance
            </button>

            <!-- Status -->
            <div class="status-box">

                <h3>Attendance Status</h3>

                <p id="status">
                    Waiting for location...
                </p>

            </div>

            <!-- GPS Information -->
            <div class="location-box">

                <h3>GPS Information</h3>

                <p>
                    <strong>Latitude:</strong>
                    <span id="latitude">-</span>
                </p>

                <p>
                    <strong>Longitude:</strong>
                    <span id="longitude">-</span>
                </p>

                <p>
                    <strong>Accuracy:</strong>
                    <span id="accuracy">-</span>
                </p>

                <p>
                    <strong>Distance from College:</strong>
                    <span id="distance">-</span>
                </p>

            </div>

            <!-- College Information -->
            <div class="college-box">

                <h3>🏫 College Location</h3>

                <p>Allowed Radius: <strong>100 meters</strong></p>

            </div>

        </div>

    </div>

    <script src="attendance.js"></script>

</body>
</html>
