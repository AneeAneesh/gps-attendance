<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Professor Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>👨‍🏫 Professor Login</h1>

    <form id="professorLoginForm">

        <label>Professor ID</label>

        <input
            type="text"
            id="professorId"
            placeholder="Enter Professor ID"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <p id="message"></p>

    <p>
        <a href="/login.html">← Back to Login</a>
    </p>

</div>

<script>

document
.getElementById("professorLoginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const professorId =
        document.getElementById("professorId").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.innerText = "⏳ Logging in...";

    try {

        const response = await fetch("/api/professor-login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                professor_id: professorId,
                password: password
            })

        });

        const data = await response.json();

        if (data.success) {

            window.location.href =
                "/professor-dashboard.html";

        } else {

            message.innerText =
                "❌ " + data.message;

        }

    } catch (error) {

        console.error(error);

        message.innerText =
            "❌ Server connection error.";

    }

});

</script>

</body>

</html>
